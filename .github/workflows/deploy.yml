name: Deploy to Server

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH 접속 후 빌드 및 배포
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 10m
          script: |
            cd /tmp && rm -rf frontend-deploy-tmp
            git clone https://github.com/rimseong/frontend frontend-deploy-tmp
            docker cp frontend-deploy-tmp/web/. launch_app:/workspace/frontend/build/web/
            rm -rf /tmp/frontend-deploy-tmp
