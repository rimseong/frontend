<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="lunch_pick">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>lunch_pick</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!-- 브라우저 포커스 활성화용 숨김 input -->
  <input autofocus style="position:absolute;opacity:0;pointer-events:none;width:0;height:0;">
  <script>
    window.focus();

    // Flutter 초기화 후 glass pane 포커스
    const _observer = new MutationObserver(function() {
      const pane = document.querySelector('flt-glass-pane');
      if (pane) {
        _observer.disconnect();
        setTimeout(function() {
          pane.setAttribute('tabindex', '0');
          pane.focus();
        }, 1000);
      }
    });
    _observer.observe(document.body, { childList: true, subtree: true });

    window.addEventListener('load', function(ev) {
      _flutter.loader.load({
        serviceWorkerSettings: {
          serviceWorkerVersion: null,
        }
      });
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
