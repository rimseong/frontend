<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="lunch_pick">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>lunch_pick</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <script>
    // flt-glass-pane이 DOM에 나타나면 즉시 포커스 → 첫 로드부터 키보드 입력 가능
    const _glassObserver = new MutationObserver(function() {
      const pane = document.querySelector('flt-glass-pane');
      if (pane) {
        if (!pane.hasAttribute('tabindex')) pane.setAttribute('tabindex', '0');
        pane.focus();
        _glassObserver.disconnect();
      }
    });
    _glassObserver.observe(document.body, { childList: true, subtree: true });

    // 클릭할 때도 포커스 유지 (안전망)
    document.addEventListener('pointerdown', function(e) {
      const pane = document.querySelector('flt-glass-pane');
      if (pane) {
        if (!pane.hasAttribute('tabindex')) pane.setAttribute('tabindex', '0');
        pane.focus();
      }
    }, true);

    window.addEventListener('load', async function(ev) {
      if ('serviceWorker' in navigator) {
        const registrations = await navigator.serviceWorker.getRegistrations();
        if (registrations.length > 0) {
          await Promise.all(registrations.map(function(r) { return r.unregister(); }));
          window.location.reload();
          return;
        }
      }
      _flutter.loader.load({});
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
